name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: System libraries (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1 libudev-dev libusb-1.0-0-dev
      - run: python -m pip install --upgrade pip
      - name: Install (Linux)
        if: runner.os == 'Linux'
        run: pip install -e .[dev]
      # vgamepad's installer opens the interactive ViGEmBus setup on Windows,
      # which would hang a runner. The tests do not need it.
      - name: Install (Windows)
        if: runner.os == 'Windows'
        run: |
          pip install hidapi PySide6 pytest
          pip install -e . --no-deps
      - run: python -m pytest -q

  # Runs install.sh from scratch on each distribution family it claims to support.
  linux-installer:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Ubuntu (also Zorin OS and Debian)
            image: ubuntu:24.04
            prepare: apt-get update && apt-get install -y ca-certificates
            args: ""
          - name: Fedora
            image: fedora:latest
            prepare: dnf install -y tar gzip
            args: ""
          - name: Arch (also CachyOS)
            image: archlinux:latest
            prepare: pacman -Syu --noconfirm tar gzip
            args: ""
          # Bazzite cannot be run in a container; this is the closest stand-in:
          # the Fedora release it is built on, no compiler, no system packages.
          - name: No compiler, no package manager (Bazzite-like, Fedora 42)
            image: fedora:42
            prepare: dnf install -y tar gzip python3 python3-pip glib2 dbus-libs libxkbcommon libxkbcommon-x11 xcb-util-cursor mesa-libEGL libglvnd-egl libglvnd-glx fontconfig
            args: "--no-system"
    name: "install.sh: ${{ matrix.name }}"
    runs-on: ubuntu-latest
    container: ${{ matrix.image }}
    steps:
      - run: ${{ matrix.prepare }}
      - uses: actions/checkout@v4
      - name: Install
        run: GAMBIPAD_SOURCE="$PWD" bash install.sh --autostart ${{ matrix.args }}
      - name: Check the installation
        run: |
          set -x
          ~/.local/bin/gambipad --version
          QT_QPA_PLATFORM=offscreen ~/.local/share/gambipad/venv/bin/python -c "import gambipad.gui.app, evdev, hid; print('imports ok')"
          ~/.local/bin/gambipad doctor
          test -s ~/.local/share/icons/hicolor/256x256/apps/gambipad.png
          grep -q minimized ~/.config/autostart/gambipad.desktop
          test -x ~/.local/share/applications/gambipad.desktop || test -f ~/.local/share/applications/gambipad.desktop
      - name: Uninstall
        run: bash install.sh --uninstall ${{ matrix.args }} && test ! -e ~/.local/share/gambipad
